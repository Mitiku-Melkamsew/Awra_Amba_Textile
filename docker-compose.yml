services:
  postgres:
    image: postgres:16-alpine
    container_name: awra_amba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: awra_amba
      POSTGRES_PASSWORD: awra_amba_dev
      POSTGRES_DB: awra_amba_textile
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: